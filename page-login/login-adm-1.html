<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Recife Flats | Login - Administração</title>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" />
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        * { 
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(-45deg, #083C80, #1674D1, #189EF3, #EFF6FA);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            padding: 20px;
            overflow: hidden;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Partículas flutuantes */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
            z-index: 0;
        }

        .particle {
            position: absolute;
            width: 10px;
            height: 10px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            animation: float 15s infinite;
        }

        .particle:nth-child(1) { left: 10%; animation-delay: 0s; animation-duration: 20s; }
        .particle:nth-child(2) { left: 20%; animation-delay: 2s; animation-duration: 25s; }
        .particle:nth-child(3) { left: 30%; animation-delay: 4s; animation-duration: 18s; }
        .particle:nth-child(4) { left: 40%; animation-delay: 1s; animation-duration: 22s; }
        .particle:nth-child(5) { left: 50%; animation-delay: 3s; animation-duration: 19s; }
        .particle:nth-child(6) { left: 60%; animation-delay: 5s; animation-duration: 21s; }
        .particle:nth-child(7) { left: 70%; animation-delay: 2s; animation-duration: 24s; }
        .particle:nth-child(8) { left: 80%; animation-delay: 4s; animation-duration: 17s; }
        .particle:nth-child(9) { left: 90%; animation-delay: 1s; animation-duration: 23s; }
        .particle:nth-child(10) { left: 15%; animation-delay: 3s; animation-duration: 20s; }

        @keyframes float {
            0%, 100% {
                transform: translateY(100vh) scale(0);
                opacity: 0;
            }
            10% {
                opacity: 1;
            }
            90% {
                opacity: 1;
            }
            100% {
                transform: translateY(-100vh) scale(1);
                opacity: 0;
            }
        }

        /* Container Principal */
        .container {
            position: relative;
            z-index: 1;
            display: flex;
            width: 900px;
            max-width: 100%;
            min-height: 550px;
            background:  linear-gradient(135deg, #0a1628 0%, #1a365d 50%, #0a1628 100%);
            border-radius: 24px;
            box-shadow: 
                0 25px 50px rgba(0, 0, 0, 0.15),
                0 0 0 1px rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            overflow: hidden;
            animation: slideUp 0.8s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Lado da Logo */
        .logo-side {
            flex: 1;
            background: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 50px 40px;
            position: relative;
            overflow: hidden;
        }

        /* Efeito de brilho na logo side */
        .logo-side::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 60%);
            animation: rotate 20s linear infinite;
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* Círculos decorativos */
        .logo-side::after {
            content: '';
            position: absolute;
            width: 300px;
            height: 300px;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation: pulse 4s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.5; }
            50% { transform: translate(-50%, -50%) scale(1.1); opacity: 0.2; }
        }

        .logo-content {
            position: relative;
            z-index: 2;
            text-align: center;
        }

        .logo-content img {
            max-width: 280px;
            height: auto;
            margin-top: 10px;
            margin-bottom: 10px;
            filter: drop-shadow(0 10px 30px rgba(0,0,0,0.3));
            animation: logoFloat 3s ease-in-out infinite;
        }

        
        @keyframes logoFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .logo-tagline {
            color: rgba(255,255,255,0.7);
            font-size: 1rem;
            font-weight: 300;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        /* Lado do Login */
        .login-side {
            flex: 1;
            padding: 50px 45px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .login-header {
            margin-bottom: 35px;
        }

        .login-header h1 {
            font-size: 2rem;
            font-weight: 600;
            color: #e2e2e5;
            margin-bottom: 8px;
            background: #eee;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .login-header p {
            color: #e9e9e9;
            font-size: 0.70rem;
        }

        /* Mensagens */
        .message {
            padding: 14px 18px;
            border-radius: 12px;
            margin-bottom: 20px;
            font-size: 10px;
            display: none;
            align-items: center;
            gap: 12px;
            animation: shake 0.5s ease-in-out;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-5px); }
            40%, 80% { transform: translateX(5px); }
        }

        .message.show {
            display: flex;
        }

        .message.error {
            background: #e24309;
            color: #e9e2e2;
            border: 1px solid #ff6b6b40;
        }

        .message.success {
            background: linear-gradient(135deg, #00b89420, #00cec920);
            color: #00b894;
            border: 1px solid #00b89440;
            animation: none;
        }

        .message i {
            font-size: 15px;
        }

        /* Form */
        .login-form {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .input-group {
            position: relative;
        }

        .input-group i {
            position: absolute;
            left: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: #aaa;
            font-size: 18px;
            transition: all 0.3s ease;
        }

        .input-group input {
            width: 100%;
            padding: 16px 18px 16px 50px;
            font-size: 15px;
            border: 2px solid #eee;
            border-radius: 14px;
            outline: none;
            transition: all 0.3s ease;
            background: #f8f9fa;
        }

        .input-group input:focus {
            border-color: #1cba51;
            background: #fff;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
        }

        .input-group input:focus + i,
        .input-group input:not(:placeholder-shown) + i {
            color: #26a93e;
        }

        .input-group input.error {
            border-color: #ff6b6b;
            background: #fff;
            box-shadow: 0 0 0 4px rgba(255, 107, 107, 0.1);
        }

        .input-group input::placeholder {
            color: #aaa;
        }

        /* Opções do form */
        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            color: #666;
        }

        .remember-me input[type="checkbox"] {
            display: none;
        }

        .checkmark {
            width: 20px;
            height: 20px;
            border: 2px solid #ddd;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .checkmark i {
            font-size: 12px;
            color: #fff;
            opacity: 0;
            transform: scale(0);
            transition: all 0.2s ease;
        }

        .remember-me input:checked + .checkmark {
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-color: #fff;
            border: 1px solid #c1c0c0;
        }

        .remember-me input:checked + .checkmark i {
            opacity: 1;
            transform: scale(1);
        }

        .forgot-password {
            color: #eee;
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .forgot-password:hover {
            color: #764ba2;
        }

        /* Botão de submit */
        .btn-submit {
            padding: 16px;
            font-size: 1rem;
            font-weight: 600;
            color: #fff;
            background: linear-gradient(135deg, #0B7EDC 0%, #00C9FF 100%);
            border: none;
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            margin-top: 10px;
        }

        .btn-submit::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.5s ease;
        }

        .btn-submit:hover::before {
            left: 100%;
        }

        .btn-submit:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }

        .btn-submit:active {
            transform: translateY(-1px);
        }

        .btn-submit:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        /* Spinner */
        .spinner {
            display: inline-block;
            width: 22px;
            height: 22px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Responsividade */
        @media (max-width: 768px) {
            .container {
                flex-direction: column;
                min-height: auto;
            }

            .logo-side {
                padding: 40px 30px;
            }

            .logo-content img {
                max-width: 200px;
            }

            .login-side {
                padding: 40px 30px;
            }

            .login-header h1 {
                font-size: 1.8rem;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 15px;
            }

            .container {
                border-radius: 20px;
            }

            .logo-side {
                padding: 30px 20px;
            }

            .logo-content img {
                max-width: 160px;
                margin-bottom: 15px;
            }

            .logo-tagline {
                font-size: 0.85rem;
            }

            .login-side {
                padding: 30px 25px;
            }

            .login-header h1 {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>

    <!-- Brilhos na água (gerados por JS) -->
<div class="sparkles" id="sparklesContainer"></div>

<!-- Partículas flutuantes -->
<div class="particles">
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
    <div class="particle"></div>
</div>

<div class="container">
    <!-- LADO ESQUERDO: LOGO -->
    <div class="logo-side">
        <div class="logo-content">
            <img src="./img/logo-recife-flat-temporada26.svg" alt="Recife Flats">
            <p class="logo-tagline">Painel Administrativo</p>
        </div>
    </div>

    <!-- LADO DIREITO: LOGIN -->
    <div class="login-side">
        <div class="login-header">
            <h1>Administrativo</h1>
            <p>Faça login para acessar o sistema</p>
        </div>

        <!-- Mensagem de erro -->
        <div class="message error" id="errorMessage">
            <i class="fas fa-exclamation-circle"></i>
            <span id="errorText">Usuário ou senha incorretos</span>
        </div>

        <!-- Mensagem de sucesso -->
        <div class="message success" id="successMessage">
            <i class="fas fa-check-circle"></i>
            <span>Login realizado! Redirecionando...</span>
        </div>

        <!-- Formulário de Login -->
        <form class="login-form" id="loginForm">
            <div class="input-group">
                <input type="text" id="username" placeholder="Usuário" required>
                <i class="fas fa-user"></i>
            </div>

            <div class="input-group">
                <input type="password" id="password" placeholder="Senha" required>
                <i class="fas fa-lock"></i>
            </div>
            
            <div class="form-options">
                <label class="remember-me">
                    <input type="checkbox" id="remember">
                    <span class="checkmark"><i class="fas fa-check"></i></span>
                    Lembrar de mim
                </label>
                <a href="#" class="forgot-password" onclick="forgotPassword()">Esqueceu a senha?</a>
            </div>

            <button type="submit" class="btn-submit" id="submitBtn">
                Entrar
            </button>
        </form>
    </div>
</div>

<script>

      // =============================================
    // EFEITOS DE ÁGUA - BRILHOS
    // =============================================
    function createSparkles() {
        const container = document.getElementById('sparklesContainer');
        const sparkleCount = window.innerWidth < 768 ? 20 : 40;

        for (let i = 0; i < sparkleCount; i++) {
            const sparkle = document.createElement('div');
            sparkle.className = 'sparkle';
            
            // Posição aleatória
            sparkle.style.left = Math.random() * 100 + '%';
            sparkle.style.top = Math.random() * 100 + '%';
            
            // Tamanho aleatório
            const size = Math.random() * 4 + 2;
            sparkle.style.width = size + 'px';
            sparkle.style.height = size + 'px';
            
            // Delay aleatório
            sparkle.style.animationDelay = Math.random() * 5 + 's';
            sparkle.style.animationDuration = (Math.random() * 2 + 2) + 's';
            
            container.appendChild(sparkle);
        }
    }

    // Inicializa efeitos
    createBubbles();
    createSparkles();

    // Recria efeitos ao redimensionar
    let resizeTimeout;
    window.addEventListener('resize', function() {
        clearTimeout(resizeTimeout);
        resizeTimeout = setTimeout(function() {
            document.getElementById('bubblesContainer').innerHTML = '';
            document.getElementById('sparklesContainer').innerHTML = '';
            createBubbles();
            createSparkles();
        }, 300);
    });
    // =============================================
    // CONFIGURAÇÃO DOS USUÁRIOS
    // =============================================
    const USERS = {
        'adm-gabi': 'ADM2025',
        'adm-lucas': 'ADM2025',
        'adm-vanessa': 'ADM2025'
    };

    // Página para redirecionar após login
    const REDIRECT_URL = 'dashboard.html';

    // =============================================
    // ELEMENTOS DO DOM
    // =============================================
    const loginForm = document.getElementById('loginForm');
    const usernameInput = document.getElementById('username');
    const passwordInput = document.getElementById('password');
    const rememberCheckbox = document.getElementById('remember');
    const submitBtn = document.getElementById('submitBtn');
    const errorMessage = document.getElementById('errorMessage');
    const errorText = document.getElementById('errorText');
    const successMessage = document.getElementById('successMessage');

    // =============================================
    // VERIFICAR SE JÁ ESTÁ LOGADO
    // =============================================
    window.onload = function() {
        const loggedUser = localStorage.getItem('loggedUser') || sessionStorage.getItem('loggedUser');
        
        if (loggedUser) {
            window.location.href = REDIRECT_URL;
        }

        const savedUsername = localStorage.getItem('savedUsername');
        if (savedUsername) {
            usernameInput.value = savedUsername;
            rememberCheckbox.checked = true;
        }
    };

    // =============================================
    // FUNÇÃO DE LOGIN
    // =============================================
    loginForm.addEventListener('submit', function(e) {
        e.preventDefault();

        const username = usernameInput.value.trim().toLowerCase();
        const password = passwordInput.value;

        hideMessages();
        removeInputErrors();

        submitBtn.disabled = true;
        submitBtn.innerHTML = '<span class="spinner"></span>';

        setTimeout(function() {
            if (USERS[username] && USERS[username] === password) {
                showSuccess();

                if (rememberCheckbox.checked) {
                    localStorage.setItem('loggedUser', username);
                    localStorage.setItem('savedUsername', username);
                } else {
                    sessionStorage.setItem('loggedUser', username);
                    localStorage.removeItem('savedUsername');
                }

                setTimeout(function() {
                    window.location.href = REDIRECT_URL;
                }, 1500);

            } else {
                showError('Usuário ou senha incorretos');
                usernameInput.classList.add('error');
                passwordInput.classList.add('error');
                
                submitBtn.disabled = false;
                submitBtn.innerHTML = 'Entrar';
            }
        }, 800);
    });

    // =============================================
    // FUNÇÕES AUXILIARES
    // =============================================
    function showError(message) {
        errorText.textContent = message;
        errorMessage.classList.add('show');
    }

    function showSuccess() {
        successMessage.classList.add('show');
    }

    function hideMessages() {
        errorMessage.classList.remove('show');
        successMessage.classList.remove('show');
    }

    function removeInputErrors() {
        usernameInput.classList.remove('error');
        passwordInput.classList.remove('error');
    }

    usernameInput.addEventListener('input', function() {
        this.classList.remove('error');
        hideMessages();
    });

    passwordInput.addEventListener('input', function() {
        this.classList.remove('error');
        hideMessages();
    });

    function forgotPassword() {
        alert('Entre em contato com o administrador do sistema para redefinir sua senha.');
    }
</script>

</body>
</html>
